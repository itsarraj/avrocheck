[package]
name = "avrocheck"
version = "0.1.0"
edition = "2021"
description = "Checks two Avro schema versions for backward/forward compatibility against Avro's documented schema resolution rules"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/avrocheck"
readme = "README.md"
keywords = ["avro", "schema", "compatibility", "kafka", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "avrocheck"
path = "src/lib.rs"

[[bin]]
name = "avrocheck"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
